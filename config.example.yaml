kubeconfigs:
  prod:
    path: $XDG_CONFIG_HOME/kube/prod-mgmt.yaml

  dev:
    path: $XDG_CONFIG_HOME/kube/dev-mgmt.yaml
    plugins:
      api-endpoint-proxy:
        sshuttle:
          host: user@bastion.example.com  # per-kubeconfig override

  # Optional per-kubeconfig overrides:
  # contexts:                  # restrict to specific contexts (default: every context in the kubeconfig)
  #   - prod-admin
  # plugins.api-endpoint-proxy.sshuttle.host: ... # overrides global sshuttle host

plugins:
  api-endpoint-proxy:
    sshuttle:
      host: gateway  # global fallback for all kubeconfigs

transforms:
  users: >-
    {name: .name, user: {exec: {
      apiVersion: "client.authentication.k8s.io/v1beta1",
      command: "kubectl",
      args: [
        "oidc-login", "get-token",
        "--oidc-issuer-url=https://staff-auth.k8s.teuto.net",
        "--token-cache-storage=keyring",
        "--oidc-client-id=kubernetes",
        "--oidc-extra-scope=email",
        "--oidc-extra-scope=groups",
        "--oidc-extra-scope=offline_access",
        "--open-url-after-authentication="
      ]
    }}}

custom_fields:
  friendly_name: '.metadata.annotations["t8s.teuto.net/cluster"] // "" | try @base64d'
  customer_name: '(.metadata.annotations["t8s.teuto.net/customer-name"] | if . != null then try @base64d else null end) // .metadata.labels["t8s.teuto.net/customer-id"]'
  customer_id: '.metadata.labels["t8s.teuto.net/customer-id"]'

cache:
  cluster_list_ttl: 300   # seconds; default 300
  kubeconfig_ttl: 3600    # seconds; default 3600 (also controls sshuttle proxy lifetime)

# Optional. Resources the read-only ServiceAccount (exec_in_cluster_readonly
# and the embedded read-only tools) may not read.
# The daemon generates a ClusterRole on each workload cluster that grants
# get/list/watch on every API resource the cluster serves except these.
#   - unset (or no denied_resources key): only Secrets are denied
#   - a list: exactly these are denied. "secrets" for core resources, and
#     "<group>/<resource>" for the rest (apps/deployments,
#     cilium.io/ciliumnetworkpolicies); a version may sit in between, like the
#     API path (apps/v1/deployments), and only identifies the group. Subresources
#     follow their parent. Secrets are readable unless you list them again.
#   - an empty list: nothing is denied, Secrets included
readonly:
  denied_resources:
    - secrets
    # - configmaps
    # - certificates.k8s.io/certificatesigningrequests

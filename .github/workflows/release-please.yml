on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-tarball:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Strip non-Linux native prebuilds
        run: |
          for d in $(find node_modules -type d -name prebuilds); do
            find "$d" -mindepth 1 -maxdepth 1 -type d ! -name 'linux-*' -exec rm -rf {} +
          done
      - run: npm pack
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" capi-shell-mcp-*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
